<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Researcher dashboard</title>
<link rel="stylesheet" href="style.css"></head>
<body><main id="app" class="wide"></main>
<script type="module">
import { CFG } from "./config.js";
import { S, DIMS, STREAMS, allQuestions } from "./survey.js";
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db = createClient(CFG.url, CFG.key), app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const QS = allQuestions(), QI = Object.fromEntries(QS.map((q) => [q.id, q]));
const sl = Object.fromEntries(STREAMS), AREA = Object.fromEntries([...DIMS, ["other", "Something else"]]);
let rows = [], F = { stream: "", year: "", level: "" }, G = { v: "mig_settle", by: "stream" };
const val = (r, id) => r.answers?.[id]?.v;
const band = (a) => (a < 20 ? "18–19" : a < 22 ? "20–21" : a < 24 ? "22–23" : "24+");
const grp = { stream: (r) => sl[r.profile.stream] || r.profile.stream, year: (r) => "Year " + r.profile.year, level: (r) => r.profile.level, age: (r) => band(+r.profile.age), state: (r) => r.profile.state };
const mean = (a) => (a.length ? (a.reduce((x, y) => x + y, 0) / a.length).toFixed(2) : "–");
const filt = () => rows.filter((r) => (!F.stream || r.profile.stream === F.stream) && (!F.year || r.profile.year === F.year) && (!F.level || r.profile.level === F.level));

function login(msg = "") {
  app.innerHTML = `<h1>Researcher login</h1><div class="q"><label>Email</label><input id="e" type="email"></div><div class="q"><label>Password</label><input id="p" type="password"></div><p class="err">${msg}</p><button class="go" id="in">Sign in</button>`;
  document.getElementById("in").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: e.value, password: p.value });
    error ? login("Sign-in failed.") : start();
  };
}
async function start() {
  const { data: { session } } = await db.auth.getSession(); if (!session) return login();
  app.innerHTML = "<p>Loading…</p>"; rows = [];
  for (let f = 0; ; f += 1000) {
    const { data, error } = await db.from("responses").select("*").order("created_at").range(f, f + 999);
    if (error) return login("Not authorised or request failed.");
    rows.push(...data); if (data.length < 1000) break;
  }
  draw();
}
const bars = (title, fn, data) => {
  const c = {}; data.forEach((r) => { const k = fn(r); if (k !== undefined && k !== "") (c[k] = (c[k] || 0) + 1); });
  const m = Math.max(1, ...Object.values(c));
  return `<section><h3>${title}</h3>${Object.entries(c).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="bar"><span>${esc(k)}</span><i style="width:${(n / m) * 100}%"></i><b>${n}</b></div>`).join("") || "<p class='sub'>No data</p>"}</section>`;
};
const optLabel = (id, v) => (QI[id].o.find((o) => o[0] === v) || [v, v])[1];
function draw() {
  const d = filt(), sel = (k, o) => `<select data-f="${k}"><option value="">All</option>${o.map(([v, l]) => `<option value="${esc(v)}" ${F[k] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const dur = d.map((r) => r.duration_s).sort((a, b) => a - b), med = dur.length ? Math.round(dur[Math.floor(dur.length / 2)] / 60 * 10) / 10 : "–";
  const dims = [...DIMS, ["field", "Field-specific opportunities (contextual)"]];
  const gap = dims.map(([i, l]) => { const a = d.map((r) => val(r, "imp_" + i)).filter(Number.isFinite), b = d.map((r) => val(r, "sat_" + i)).filter(Number.isFinite); return `<tr><td>${esc(l)}</td><td>${mean(a)}</td><td>${mean(b)}</td><td>${a.length && b.length ? (mean(a) - mean(b)).toFixed(2) : "–"}</td><td>${Math.min(a.length, b.length)}</td></tr>`; }).join("");
  const scaleQs = QS.filter((q) => q.k === "scale" && !q.id.startsWith("imp_") && !q.id.startsWith("sat_")).concat(QS.filter((q) => q.id.match(/^(imp|sat)_/)));
  const gmap = {}; d.forEach((r) => { const v = val(r, G.v); if (Number.isFinite(v)) (gmap[grp[G.by](r)] ||= []).push(v); });
  const multi = (id) => { const c = {}; d.forEach((r) => (val(r, id) || []).forEach((v) => (c[v] = (c[v] || 0) + 1))); return Object.entries(c).sort((a, b) => b[1] - a[1]).map(([v, n]) => `<div class="bar"><span>${esc(optLabel(id, v))}</span><i style="width:${(n / d.length) * 100}%"></i><b>${n}</b></div>`).join(""); };
  const open = d.flatMap((r) => (val(r, "vision_changes") || []).filter((x) => x && (x.a || (x.t || "").trim())).map((x) => `<li>${esc((AREA[x.a] ? AREA[x.a] + ": " : "") + (x.t || ""))}</li>`)).join("");
  app.innerHTML = `<header><h1>Researcher dashboard</h1><button class="lnk" id="out">Sign out</button></header>
  <div class="filters">${["stream", "year", "level"].map((k) => `<label>${k}${sel(k, k === "stream" ? STREAMS : k === "year" ? ["1", "2", "3", "4", "5 or above"].map((x) => [x, x]) : ["Undergraduate", "Postgraduate", "Other"].map((x) => [x, x]))}</label>`).join("")}</div>
  <p class="stat"><b>${d.length}</b> responses (of ${rows.length} total) · median completion ${med} min</p>
  <div class="grid">${bars("By stream", grp.stream, d)}${bars("By year of study", grp.year, d)}${bars("By level", grp.level, d)}${bars("By age", grp.age, d)}${bars("Migration plan", (r) => optLabel("mig_plan", val(r, "mig_plan")), d)}</div>
  <h3>Importance vs satisfaction (mean 1–5; gap = importance − satisfaction)</h3><div class="scroll"><table><tr><th>Dimension</th><th>Importance</th><th>Satisfaction</th><th>Gap</th><th>n</th></tr>${gap}</table></div>
  <h3>Compare groups</h3><div class="filters"><label>Variable<select id="gv">${scaleQs.map((q) => `<option value="${q.id}" ${G.v === q.id ? "selected" : ""}>${q.id} — ${esc(q.t.slice(0, 55))}</option>`).join("")}</select></label><label>Group by<select id="gb">${Object.keys(grp).map((k) => `<option ${G.by === k ? "selected" : ""}>${k}</option>`).join("")}</select></label></div>
  <div class="scroll"><table><tr><th>Group</th><th>n</th><th>Mean</th></tr>${Object.entries(gmap).map(([k, a]) => `<tr><td>${esc(k)}</td><td>${a.length}</td><td>${mean(a)}</td></tr>`).join("")}</table></div>
  <div class="grid"><section><h3>Reasons for considering abroad</h3>${multi("reasons_abroad")}</section><section><h3>Reasons for staying</h3>${multi("reasons_stay")}</section></div>
  <h3>Open-ended: desired changes in India</h3><ul class="open">${open || "<li>No responses</li>"}</ul>
  <h3>Export (respects filters above)</h3><button class="go" id="x1">Anonymised CSV</button> <button class="go alt" id="x2">Full CSV</button> <button class="go alt" id="x3">Codebook CSV</button>`;
  app.querySelectorAll("[data-f]").forEach((s) => (s.onchange = () => { F[s.dataset.f] = s.value; draw(); }));
  gv.onchange = () => { G.v = gv.value; draw(); }; gb.onchange = () => { G.by = gb.value; draw(); };
  out.onclick = async () => { await db.auth.signOut(); login(); };
  x1.onclick = () => dl(true); x2.onclick = () => dl(false); x3.onclick = codebook;
}
const cell = (v) => { let s = Array.isArray(v) ? v.map((x) => (x && typeof x === "object" ? `${x.a || ""}: ${x.t || ""}` : x)).join(" | ") : v ?? ""; s = String(s); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
function save(name, lines) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" })); a.download = name; a.click(); }
function dl(anon) {
  const pk = ["age", "gender", "state", "college_type", ...(anon ? [] : ["college_name"]), "course", "course_text", "stream", "year", "level", "studied_abroad", "relatives_abroad", "considering_study_abroad"];
  const ids = QS.map((q) => q.id), hdr = ["participant_id", "created_at", "survey_version", "duration_s", ...pk, ...ids];
  save(anon ? "responses_anonymised.csv" : "responses_full.csv", [hdr.join(","), ...filt().map((r) => [r.participant_id, r.created_at, r.survey_version, r.duration_s, ...pk.map((k) => r.profile[k]), ...ids.map((i) => val(r, i))].map(cell).join(","))]);
}
function codebook() { save("codebook.csv", ["question_id,construct,section,type,scale,text", ...QS.map((q) => [q.id, q.c, q.section, q.k, q.s ? S[q.s].map((l, i) => `${i + 1}=${l}`).join("; ") : q.o ? q.o.map((o) => `${o[0]}=${o[1]}`).join("; ") : "", q.t].map(cell).join(","))]); }
start();
</script></body></html>
