<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Youth Aspirations &amp; India</title>
<link rel="stylesheet" href="style.css"></head>
<body><div id="bar"><i id="fill"></i></div><main id="app"></main>
<script type="module">
import { CFG } from "./config.js";
import { S, DIMS, PROFILE, VERSION, build, streamOf } from "./survey.js";
const AREAS = [...DIMS, ["other", "Something else"]];
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const db = createClient(CFG.url, CFG.key), app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let step = "intro", si = 0, secs = [], Q = {}, prof = {}, ans = {}, err = "", busy = false;
const t0 = Date.now();

function qHtml(q, lastScale) {
  let b = "", lg = "";
  if (q.k === "scale") {
    if (q.s !== lastScale.v) { lg = `<p class="lg">${S[q.s].map((l, i) => `<b>${i + 1}</b> ${esc(l)}`).join(" &nbsp;·&nbsp; ")}</p>`; lastScale.v = q.s; }
    b = `<div class="pills">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-q="${q.id}" data-v="${n}" class="${ans[q.id]?.v === n ? "on" : ""}">${n}</button>`).join("")}</div>`;
  } else if (q.k === "single" || q.k === "multi") {
    const cur = ans[q.id]?.v;
    b = q.o.map(([v, l]) => `<label class="opt"><input type="${q.k === "single" ? "radio" : "checkbox"}" name="${q.id}" data-q="${q.id}" value="${esc(v)}" ${(q.k === "single" ? cur === v : (cur || []).includes(v)) ? "checked" : ""}> ${esc(l)}</label>`).join("");
  } else {
    const cur = ans[q.id]?.v || [];
    if (q.k === "text3") b = [0, 1, 2].map((i) => { const c = cur[i] || {}; return `<div class="tri"><select data-a="${q.id}" data-i="${i}"><option value="">${i + 1}. Choose an area…</option>${AREAS.map(([v, l]) => `<option value="${v}" ${c.a === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select><input class="tx" data-t="${q.id}" data-i="${i}" maxlength="250" placeholder="Or write in your own words" value="${esc(c.t)}"></div>`; }).join("");
    else b = `<input class="tx" data-t="${q.id}" data-i="0" maxlength="250" placeholder="Optional" value="${esc(cur[0])}">`;
  }
  const row = q.k === "scale" && q.s !== "cnd" && q.s !== "agr" && q.id.match(/^(imp|sat)_/);
  return lg + `<div class="q ${row ? "row" : ""}"><p>${esc(q.t)}</p>${b}</div>`;
}
function pHtml(f) {
  const v = prof[f.id] ?? "";
  const inp = f.k === "sel" ? `<select data-p="${f.id}"><option value="">Select…</option>${f.o.map(([a, l]) => `<option value="${esc(a)}" ${v === a ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`
    : `<input data-p="${f.id}" ${f.k === "num" ? 'type="number" min="18" max="45" inputmode="numeric"' : 'maxlength="120"'} value="${esc(v)}">`;
  return `<div class="q"><label>${esc(f.t)}</label>${inp}</div>`;
}
function render() {
  let h = "", pct = 0;
  if (step === "intro") h = `<p class="k">Academic research study</p><h1>Youth Aspirations &amp; India</h1><p class="lead">This anonymous academic survey explores the aspirations, expectations, and migration intentions of Indian college students.</p><p class="meta">Estimated time: 5–8 minutes</p><button class="go" data-go="consent">Start Survey</button>`;
  else if (step === "consent") h = `<p class="k">Participant information</p><h2>Before you begin</h2>
  <ul class="info"><li><b>Purpose.</b> To understand what Indian college students expect from India and their intentions regarding study, work and settlement in India or abroad.</li>
  <li><b>Who can take part.</b> Students currently enrolled in a college or university in India, aged 18 or over.</li>
  <li><b>Duration.</b> About 5–8 minutes.</li><li><b>Voluntary.</b> Participation is voluntary. You may stop at any time before submitting by closing this page; nothing is saved until you submit. You can skip any question you are unsure about by choosing the neutral option or leaving optional fields blank.</li>
  <li><b>Anonymity.</b> We do not collect your name, email, phone number or IP address. Each response gets a random ID. College name is optional.</li>
  <li><b>Data use and access.</b> Responses are used only for academic research and reported in aggregate. Only the researcher can access the data.</li>
  <li><b>Contact.</b> ${esc(CFG.researcher)}, ${esc(CFG.institution)} — <a href="mailto:${esc(CFG.email)}">${esc(CFG.email)}</a></li></ul>
  <label class="opt"><input type="checkbox" id="consent"> I agree to participate in this research study.</label><p class="err">${err}</p><button class="go" data-go="profile">Continue</button>`;
  else if (step === "profile") { pct = 8; h = `<p class="k">Section A</p><h2>About you</h2><p class="sub">Used only to compare groups. Nothing here identifies you.</p>${PROFILE.map(pHtml).join("")}<p class="err">${err}</p><button class="go" data-go="next">Continue</button>`; }
  else if (step === "sec") {
    const s = secs[si]; pct = 12 + (si / secs.length) * 88; const last = { v: null };
    h = `<p class="k">Section ${s.id} · ${si + 1} of ${secs.length}</p><h2>${esc(s.title)}</h2><p class="sub">${esc(s.sub)}</p>${s.qs.map((q) => qHtml(q, last)).join("")}<input class="hp" id="hp" tabindex="-1" autocomplete="off"><p class="err">${err}</p><button class="go" data-go="next" ${busy ? "disabled" : ""}>${si === secs.length - 1 ? (busy ? "Submitting…" : "Submit") : "Continue"}</button>`;
  } else { pct = 100; h = `<h1>Thank you</h1><p class="lead">Your response has been recorded anonymously. You may now close this page.</p><p class="meta">Questions about the study: ${esc(CFG.email)}</p>`; }
  app.innerHTML = h; document.getElementById("fill").style.width = pct + "%";
}
function validate() {
  if (step === "profile") {
    for (const f of PROFILE) { const v = prof[f.id]; if (f.opt) continue; if (v === undefined || v === "") return `Please answer: ${f.t}`; }
    if (!prof.course && !(prof.course_text || "").trim()) return "Please choose your course or type it in.";
    const a = +prof.age; if (!(a >= 18 && a <= 45)) return "This study is for participants aged 18 to 45.";
    return "";
  }
  for (const q of secs[si].qs) {
    if (q.opt) continue; const v = ans[q.id]?.v;
    if (q.k === "text3") { if (!(v || []).some((x) => x && (x.a || (x.t || "").trim()))) return "Please give at least one change (choose an area or write it)."; }
    else if (q.k === "multi") { if (!v || !v.length) return "Please select at least one option in each question."; }
    else if (v === undefined) return "Please answer every question on this page.";
  }
  return "";
}
async function submit() {
  busy = true; render();
  if (document.getElementById("hp")?.value) { busy = false; step = "done"; return render(); } // honeypot
  const row = { participant_id: crypto.randomUUID(), survey_version: VERSION, consent: true, duration_s: Math.round((Date.now() - t0) / 1000), profile: prof, answers: ans };
  const { error } = await db.from("responses").insert(row);
  busy = false;
  if (error) { err = "Sorry, your response could not be saved. Please check your connection and try again."; return render(); }
  localStorage.setItem("submitted", "1"); step = "done"; render();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-v]");
  if (b) { const q = Q[b.dataset.q]; ans[q.id] = { c: q.c, v: +b.dataset.v }; b.parentNode.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); return; }
  const g = e.target.closest("[data-go]"); if (!g || busy) return;
  err = "";
  if (g.dataset.go === "consent") step = "consent";
  else if (g.dataset.go === "profile") { if (!document.getElementById("consent").checked) { err = "Please tick the box to agree to participate."; return render(); } step = "profile"; }
  else if (g.dataset.go === "next") {
    err = validate(); if (err) return render();
    if (step === "profile") { prof.stream = streamOf(prof.course); secs = build(prof); secs.forEach((s) => s.qs.forEach((q) => (Q[q.id] = q))); step = "sec"; si = 0; }
    else if (si === secs.length - 1) return submit(); else si++;
  }
  render(); scrollTo(0, 0);
});
const onIn = (e) => {
  const t = e.target;
  if (t.dataset.p) prof[t.dataset.p] = t.value;
  else if (t.dataset.t || t.dataset.a) { const id = t.dataset.t || t.dataset.a, q = Q[id], a = ans[id] || { c: q.c, v: [] }, i = +t.dataset.i; if (q.k === "text3") a.v[i] = { ...(a.v[i] || {}), [t.dataset.a ? "a" : "t"]: t.value }; else a.v[i] = t.value; ans[id] = a; }
  else if (t.dataset.q && t.type === "radio") ans[t.dataset.q] = { c: Q[t.dataset.q].c, v: t.value };
  else if (t.dataset.q && t.type === "checkbox") {
    const q = Q[t.dataset.q], boxes = [...document.querySelectorAll(`input[name="${q.id}"]`)];
    if (q.x) boxes.forEach((x) => { if (t.checked && t.value === q.x ? x !== t : t.checked && x.value === q.x) x.checked = false; });
    if (q.max && boxes.filter((x) => x.checked).length > q.max) t.checked = false;
    ans[q.id] = { c: q.c, v: boxes.filter((x) => x.checked).map((x) => x.value) };
  }
};
document.addEventListener("input", onIn); document.addEventListener("change", onIn);
if (localStorage.getItem("submitted")) CFG.warnRepeat = true;
render();
</script></body></html>
